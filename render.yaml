databases:
  - name: cellexia-subscriptions-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cellexia-subscriptions
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Paid, always-on plan is required: SCHEDULER_MODE=internal runs a 60s
    # billing/dunning/gifts/win-back loop inside this process. A sleeping
    # free-tier instance would silently stop renewals — see docs/INSTALL.md §3.
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cellexia-subscriptions-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_customers,write_customers,read_orders,read_products,write_products,read_purchase_options,write_purchase_options,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods,write_customer_payment_methods,read_locales,read_markets,read_inventory,read_fulfillments,read_discounts
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCHEDULER_MODE
        value: internal
      - key: APP_SIGNING_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Europe/London
      - key: KLAVIYO_PRIVATE_API_KEY
        sync: false
      - key: KLAVIYO_API_REVISION
        value: "2025-01-15"
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_PROVIDER
        value: none
