# Cellexia Continuous Treatment — customer account UI extension.
#
# Surfaces a "Your Continuous Treatment" card inside the new customer accounts
# (Profile page + Order index page) linking to the app-proxy portal hand-off.
# Pure link surface: no data fetching, no network access, no settings.
#
# Pinned behind the Admin API version deliberately: @shopify/ui-extensions-react
# has no 2025.10 release (it jumps from 2025.7.4 straight to 2026.0.0, a
# packaging restructure), so this extension's tooling line stays on 2025-07 —
# same pattern as the sibling AOV & LTV Booster app's checkout extensions.

api_version = "2025-07"

[[extensions]]
type = "ui_extension"
name = "customer-portal-link"
handle = "cellexia-portal-link"
uid = "536347a9-0d88-09fd-2bb3-7f6b25f9d4b5bd913e7a"
description = "Entry card to the Cellexia treatment portal inside customer accounts"

  [[extensions.targeting]]
  module = "./src/index.tsx"
  target = "customer-account.profile.block.render"

  [[extensions.targeting]]
  module = "./src/index.tsx"
  target = "customer-account.order-index.block.render"
