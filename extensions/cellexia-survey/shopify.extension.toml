# Cellexia Post-purchase Survey — checkout UI extension (v1.21.0).
# Two render targets, one extension: the Thank You page (right after checkout)
# and the customer-account Order Status page (revisits). Renders ONLY when the
# order contains a subscription (selling-plan) line; posts one-tap answers to
# the app backend (POST /api/survey) with a Shopify session token.
# Deployed together with the app via `npm run deploy`.
#
# One-time merchant setup after deploy (documented in CHANGELOG v1.21.0 and
# docs/OPERATIONS.md § Post-purchase survey):
#   1. Shopify admin → Settings → Checkout → customize → Thank you page:
#      add the "Cellexia Post-purchase Survey" block and set its App URL
#      setting to the app host (same value as SHOPIFY_APP_URL, no trailing
#      slash).
#   2. Repeat in the checkout-and-accounts editor for the Order status page.
# The survey renders nothing until the App URL is set; the "Manage your
# subscription" card (v1.28.0, src/manage-link.jsx) needs no setting — it
# renders on subscription orders as soon as the block is placed.

# Checkout UI extension versions are only accepted while supported (~4
# quarters); this MUST track a current version and stay in lockstep with the
# @shopify/ui-extensions package minor (2026-01 ↔ ~2026.1.x) — both pinned by
# tests/survey-instrument.test.ts. "2025-01" (copied from the Admin API pin)
# was already outside the checkout support window at ship time and
# hard-rejected the whole `npm run deploy`.
api_version = "2026-01"

[[extensions]]
name = "Cellexia Post-purchase Survey"
handle = "cellexia-survey"
uid = "12ae066e-4b1c-f032-811d-9258aea9ef30e01457a1"
type = "ui_extension"

  [[extensions.targeting]]
  target = "purchase.thank-you.block.render"
  module = "./src/ThankYou.jsx"

  [[extensions.targeting]]
  target = "customer-account.order-status.block.render"
  module = "./src/OrderStatus.jsx"

  [extensions.capabilities]
  network_access = true

  [extensions.settings]
    [[extensions.settings.fields]]
    key = "app_url"
    type = "single_line_text_field"
    name = "App URL"
    description = "The Cellexia Subscriptions app host, e.g. https://your-app.fly.dev — same value as SHOPIFY_APP_URL, without a trailing slash. The survey stays hidden until this is set (the Manage your subscription card shows regardless)."
