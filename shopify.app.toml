# Cellexia Subscriptions — Shopify app configuration
#
# IMPORTANT (developer): after creating the app in the Partner Dashboard, run
#   npm run config:link
# to link this file to your app, which fills in client_id. Then `npm run deploy`.
#
# See docs/INSTALL.md for the full installation runbook, including how to
# request access to the protected Subscriptions APIs and protected customer data.

client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "Cellexia Subscriptions"
handle = "cellexia-subscriptions"
application_url = "https://REPLACE_WITH_YOUR_APP_HOST"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Subscriptions require protected API access — request in Partner Dashboard:
# App setup → API access → "Access Subscriptions APIs" + "Protected customer data access".
# write_orders: required by refundCreate (admin cycle refunds in the subscriber
# cockpit) and orderCancel. write_order_edits: required by the order-edit
# mutations (orderEditBegin/AddVariant/AddLineItemDiscount/Commit) that attach
# the first-order gift to the origin order — without it every gift silently
# defers to cycle 1. Keep in sync with SCOPES in .env / docs/INSTALL.md.
# NOTE: "write_customer_payment_methods" is not a real Shopify scope (there is
# no write variant of Customer Payment Methods) and was removed — verified
# against Shopify's own mutation docs: customerPaymentMethodGetUpdateUrl and
# customerPaymentMethodSendUpdateEmail (the only two payment-method mutations
# this app calls) both require write_customers, already listed below.
scopes = "read_customers,write_customers,read_orders,write_orders,write_order_edits,read_products,write_products,read_purchase_options,write_purchase_options,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods,read_locales,read_markets,read_inventory,read_fulfillments,read_discounts"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_APP_HOST/auth/callback",
  "https://REPLACE_WITH_YOUR_APP_HOST/auth/shopify/callback",
  "https://REPLACE_WITH_YOUR_APP_HOST/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app/scopes_update",
    "subscription_contracts/create",
    "subscription_contracts/update",
    "subscription_billing_attempts/success",
    "subscription_billing_attempts/failure",
    "subscription_billing_attempts/challenged",
    "subscription_billing_cycle_edits/create",
    "subscription_billing_cycle_edits/update",
    "subscription_billing_cycle_edits/delete",
    "customer_payment_methods/create",
    "customer_payment_methods/update",
    "customer_payment_methods/revoke",
    "orders/create",
    "orders/fulfilled",
    "refunds/create"
  ]
  uri = "/webhooks"

  # Mandatory GDPR/privacy webhooks. These are NOT regular webhook topics:
  # Shopify CLI 3.x requires them under `compliance_topics` (declaring them in
  # `topics` fails `shopify app deploy` config validation). Handlers are the
  # CUSTOMERS_DATA_REQUEST / CUSTOMERS_REDACT / SHOP_REDACT entries in
  # app/lib/webhooks/handlers.server.ts — unchanged.
  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]
  uri = "/webhooks"

[app_proxy]
# The customer portal is served on the shop's own domain at:
#   https://<your-store-domain>/apps/cellexia-subscriptions/...
url = "https://REPLACE_WITH_YOUR_APP_HOST/proxy"
subpath = "cellexia-subscriptions"
prefix = "apps"

[pos]
embedded = false
