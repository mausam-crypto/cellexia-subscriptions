# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Cellexia Continuous Treatment"
handle = "cellexia-continuous-treatment"
# Set via `shopify app config link` after creating the app in the Partner Dashboard
client_id = "REPLACE_WITH_CLIENT_ID"
# PRODUCTION: replace every https://example.com in this file (application_url,
# [auth].redirect_urls, [app_proxy].url — keep the /proxy path) with the real
# app host BEFORE the first `shopify app deploy`. include_config_on_deploy
# pushes this config live as-is; `automatically_update_urls_on_dev` rewrites
# URLs only during `shopify app dev`, never on deploy.
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_customers,write_customers,read_orders,read_products,write_products,read_purchase_options,write_purchase_options,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app/scopes_update",
    "subscription_contracts/create",
    "subscription_contracts/update",
    "subscription_billing_attempts/success",
    "subscription_billing_attempts/failure",
    "subscription_billing_attempts/challenged",
    "customer_payment_methods/create",
    "customer_payment_methods/update",
    "customer_payment_methods/revoke",
    "orders/create",
    "products/update"
  ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]
  uri = "/webhooks"

# Storefront widgets and the customer portal talk to the app through the app proxy:
#   https://<shop-domain>/apps/cellexia-subscriptions/...  ->  <application_url>/proxy/...
# NOTE: "cellexia" alone is already owned by the AOV & LTV Booster app's proxy
# on this store — reusing it here would collide with that app's /apps/cellexia/*
# traffic. Keep this subpath unique across every app installed on the store.
[app_proxy]
url = "https://example.com/proxy"
prefix = "apps"
subpath = "cellexia-subscriptions"

[pos]
embedded = false
